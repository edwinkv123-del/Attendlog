<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>attendlog</title>
<link rel="icon" type="image/svg+xml" href="teacher-icon.svg">
<link rel="apple-touch-icon" href="teacher-icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F2D77">
<meta name="application-name" content="attendlog">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="attendlog">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@500..800&display=swap" rel="stylesheet">
<style>
:root{--spring:cubic-bezier(.22,1,.36,1);--bg:#F1F4FB;--card:#fff;--ink:#14213D;--mute:#53617A;--line:#D5DCEC;--seg:#E3E9F6;--brand:#1F2D77;--brand-ink:#fff;--tot:#2447B5;--tot-bg:#E4ECFF;--ok:#0B7A38;--ok-bg:#DDF5E7;--no:#B3261E;--no-bg:#FDE6E3;--no-ink:#fff;--amber:#F5B700;--amber-ink:#2A2100;--wa:#127A41;--wa-ink:#fff;--focus:#C2410C;--sh:0 1px 2px rgba(31,45,119,.08),0 8px 22px rgba(31,45,119,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1428;--card:#17223C;--ink:#F2F5FB;--mute:#AEBBD3;--line:#2F3D5C;--seg:#101A30;--brand:#16205A;--tot:#9DBBFF;--tot-bg:#1B2E5C;--ok:#6EE7A0;--ok-bg:#12351F;--no:#FF9E97;--no-bg:#47201F;--no-ink:#3A0F0C;--amber:#FFC933;--wa:#25B866;--wa-ink:#06210F;--focus:#FFC933;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0D1428;--card:#17223C;--ink:#F2F5FB;--mute:#AEBBD3;--line:#2F3D5C;--seg:#101A30;--brand:#16205A;--tot:#9DBBFF;--tot-bg:#1B2E5C;--ok:#6EE7A0;--ok-bg:#12351F;--no:#FF9E97;--no-bg:#47201F;--no-ink:#3A0F0C;--amber:#FFC933;--wa:#25B866;--wa-ink:#06210F;--focus:#FFC933;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.top{position:relative;z-index:7;background:var(--brand);color:var(--brand-ink);padding:10px 0 12px;border-radius:0 0 22px 22px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
h1{font-size:1.5rem;line-height:1.2;margin:0;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,textarea,button,.btn{font:inherit;color:var(--ink)}
input,textarea{display:block;width:100%;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:1.05rem;min-height:56px}
.top input{border-color:transparent;min-height:46px;padding:8px 12px;border-radius:14px;font-size:1rem}
#cls{font-weight:700}
.top #cls:not(:placeholder-shown):not(:focus){background:rgba(255,255,255,.16);color:var(--brand-ink);font-weight:800;font-size:1.1rem;cursor:pointer}
.dchip{position:relative;display:flex;align-items:center;gap:8px;min-height:46px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.16);color:var(--brand-ink);font-weight:700;font-size:1rem;white-space:nowrap;cursor:pointer}
.dchip svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top .dchip input{position:absolute;inset:0;width:100%;height:100%;min-height:0;padding:0;opacity:0;cursor:pointer}
.dchip input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.dchip:focus-within{outline:4px solid var(--focus);outline-offset:3px}
.top .dchip input:focus-visible{outline:0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;margin:10px 0 8px;background:var(--seg);border-radius:16px}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 6px;border:0;border-radius:13px;background:transparent;color:var(--mute);font-weight:700;font-size:.95rem;cursor:pointer}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.tab i{font-style:normal;min-width:28px;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--ink);font-size:.85rem}
.tab i.on{background:var(--no);color:var(--no-ink)}
.tools{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;margin-bottom:8px}
.ghost{min-height:46px;padding:0 14px;border:2px solid var(--tot);border-radius:16px;background:transparent;color:var(--tot);font-weight:700;font-size:1rem;white-space:nowrap;cursor:pointer}
.ghost.fill,.ghost[aria-pressed="true"]{background:var(--tot);color:var(--card)}
.hint{color:var(--mute);margin:0 0 8px;font-size:.85rem;line-height:1.3;text-align:center}
#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px}
.sec{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:6px 2px -2px;color:var(--mute);font-weight:700;font-size:.72rem;letter-spacing:.08em;line-height:1;opacity:.9}
.sec:first-child{margin-top:0}
.sec::after{content:"";flex:1;height:1px;border-radius:1px;background:var(--line)}
.stu{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm st" "sb sb";align-items:center;gap:1px 6px;width:100%;padding:5px 7px 6px 9px;margin:0;background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(20,33,61,.12);text-align:left;cursor:pointer}
.stu .nm{grid-area:nm}.stu .st{grid-area:st}.stu .sub{grid-area:sb}
.stu:active{transform:scale(.96)}
.nm{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;font-size:1.05rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.sub{display:block;font-size:min(.76rem,calc((50vw - 42px)/13));color:var(--mute);line-height:1.25}
.st{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ok-bg);color:var(--ok);box-shadow:0 0 0 2px var(--card);transform-origin:center}
.st svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.stu.abs{background:var(--no-bg);border-color:var(--no)}
.stu.abs .st,.stu.del .st{background:var(--no);color:var(--no-ink)}
.stu.del{border-style:dashed}
.stu[data-lv]{background:var(--sv);border-color:var(--sv);color:var(--si)}
.stu[data-lv] .sub{color:inherit;opacity:.85}
[data-lv="1"]{--sv:#FFE94D;--si:#2B2300}
[data-lv="2"]{--sv:#D4A500;--si:#241C00}
[data-lv="3"]{--sv:#FF8A1F;--si:#2B1300}
[data-lv="4"]{--sv:#E0312B;--si:#fff}
[data-lv="5"]{--sv:#8E0F18;--si:#fff}
.jb{position:fixed;right:max(2px,env(safe-area-inset-right,0px));top:calc(50% + 36px);transform:translateY(-50%);z-index:8;width:16px;height:min(62vh,540px);display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.jb.away{opacity:0;pointer-events:none}
.jb::before{content:"";position:absolute;z-index:-1;inset:-6px -2px -6px -8px;border-radius:999px;background:var(--card);box-shadow:var(--sh);opacity:0}
.jb.drag::before{opacity:1}
.jb::after{content:"";position:absolute;z-index:-1;inset:-6px -2px -6px -10px}
.jb button{flex:1 1 0;min-height:0;display:grid;place-items:center;width:100%;padding:0;border:0;border-radius:6px;background:transparent;color:var(--mute);font:500 11.5px/1 'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;cursor:pointer}
.jb button.na{opacity:.38}
.jb button.on{transform:translateX(-4px) scale(1.8);font-weight:800;color:var(--tot);opacity:1}
.jb button:focus-visible{outline-width:2px;outline-offset:-2px}
@media (max-height:480px){.jb button.na{display:none}}
.jbub{position:fixed;right:calc(46px + env(safe-area-inset-right,0px));top:0;z-index:9;margin-top:-38px;pointer-events:none;will-change:transform}
.jbub b{position:relative;display:grid;place-items:center;min-width:76px;height:76px;padding:0 20px;border-radius:38px;background:var(--tot);color:var(--card);font:800 2.7rem/1 'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;box-shadow:0 12px 28px rgba(31,45,119,.38);transform-origin:100% 50%}
.jbub b.sm{font-size:1.7rem}
.jbub b::after{content:"";position:absolute;right:-11px;top:50%;margin-top:-11px;border:11px solid transparent;border-right:0;border-left:12px solid var(--tot)}
#empty{color:var(--mute);text-align:center;padding:28px 12px}
details{width:86%;max-width:420px;margin:24px auto 0;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:0 16px 16px;box-shadow:var(--sh)}
summary{cursor:pointer;font-weight:700;font-size:1.1rem;padding:16px 0;text-align:center;list-style-position:inside}
details textarea{margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;padding:0 18px;border-radius:18px;border:2px solid var(--tot);background:var(--card);color:var(--tot);font-weight:700;font-size:1.1rem;text-decoration:none;cursor:pointer}
.wa{background:var(--wa);color:var(--wa-ink);border-color:var(--wa)}
.dl{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.actions{display:grid;gap:12px;margin-top:14px}
#msg{margin-top:32px;padding-bottom:40px}
#msg h2{margin-bottom:12px}
#note{margin-bottom:12px}
#out{line-height:1.55;resize:vertical}
.toast{position:fixed;left:16px;right:16px;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:9;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:.95rem;line-height:1.35;box-shadow:var(--sh)}
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(10,16,40,.6)}
.dc{width:100%;max-width:360px;background:var(--card);border-radius:28px;padding:28px 24px 24px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.dc h2{font-size:1.7rem;margin-bottom:6px}
.dc p{margin:0 0 16px;color:var(--mute);font-size:1.05rem}
.dc .btn{background:var(--tot);border-color:var(--tot);color:var(--card)}
.chk{display:block;width:84px;height:84px;margin:0 auto 14px}
.chk circle{fill:var(--ok-bg);stroke:var(--ok);stroke-width:2}
.chk path{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.strk{display:inline-block;padding:8px 16px;margin-bottom:18px;border-radius:999px;background:var(--amber);color:var(--amber-ink);font-weight:700}
.hr{display:flex;align-items:center;gap:8px}
.mw{position:relative}
.mbtn{display:grid;place-items:center;width:48px;height:48px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:var(--brand-ink);cursor:pointer}
.mbtn svg{width:24px;height:24px;fill:currentColor}
.mnu{position:absolute;right:0;top:calc(100% + 8px);z-index:12;min-width:250px;padding:6px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;box-shadow:0 14px 34px rgba(10,16,40,.28);transform-origin:top right;visibility:hidden;opacity:0;transform:scale(.8)}
.mnu.open{visibility:visible;opacity:1;transform:none}
.mi{display:flex;align-items:center;gap:12px;white-space:nowrap;width:100%;min-height:56px;padding:0 14px;border:0;border-radius:12px;background:transparent;font-weight:700;font-size:1.05rem;text-align:left;cursor:pointer}
.mi:active{background:var(--seg)}
.btn:active{transform:scale(.96)}
.btn .ck{width:26px;height:26px;margin-right:10px;flex:none;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.btn .ck path{stroke-dasharray:30;stroke-dashoffset:30;animation:dr .35s .05s forwards}
.scr{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);box-shadow:-12px 0 30px rgba(10,16,40,.25);overscroll-behavior:contain}
.scr.in{transform:none}
.sbar{flex:none;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 14px;background:var(--brand);color:var(--brand-ink)}
.sbar h1{font-size:1.4rem}
.back{display:grid;place-items:center;flex:none;width:48px;height:48px;margin-left:-8px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:var(--brand-ink);cursor:pointer}
.back svg,.arw svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mnav{flex:none;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:4px;max-width:608px;width:calc(100% - 32px);margin:14px auto 6px;padding:4px;background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.arw{display:grid;place-items:center;height:52px;padding:0;border:0;border-radius:16px;background:transparent;color:var(--tot);cursor:pointer}
.arw:active{background:var(--tot-bg)}
#mtl{position:relative;overflow:hidden;height:1.5em;font-size:1.3rem;font-weight:800}
.mt{display:block;text-align:center;line-height:1.5}.mt.out{position:absolute;left:0;right:0;top:0}
.mbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.mbody .wrap{padding-top:8px;padding-bottom:20px}
#mls{position:relative;overflow:hidden;padding-bottom:4px}
.mp{display:block}.mp.out{position:absolute;left:0;right:0;top:0}
.msum{margin:6px 2px 12px;color:var(--mute);font-weight:700;font-size:.95rem}
.mr{margin-bottom:10px;background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.mh{display:flex;align-items:center;gap:10px;width:100%;min-height:72px;padding:12px 14px;border:0;background:transparent;text-align:left;cursor:pointer}
.mh:active{background:var(--seg)}
.mn{flex:1;min-width:0;font-size:1.4rem;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.mb{flex:none;padding:6px 12px;border-radius:999px;background:var(--amber);color:var(--amber-ink);font-weight:800;font-size:.9rem;line-height:1.2;white-space:nowrap}
.mb.hi{background:var(--no);color:var(--no-ink)}
.chv{flex:none;width:24px;height:24px;fill:none;stroke:var(--mute);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.mr.open .chv{transform:rotate(180deg)}
.mbd{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden}
.mr.open .mbd{grid-template-rows:1fr;opacity:1;visibility:visible}
.mbi{min-height:0;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}
.chip{padding:6px 12px;border-radius:999px;background:var(--no-bg);color:var(--no);font-weight:700;font-size:.95rem}
.mem{padding:36px 16px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.mem span{display:block;font-size:2.4rem;margin-bottom:6px}.mem b{display:block;font-size:1.25rem}.mem small{display:block;margin-top:6px;color:var(--mute);font-size:.95rem}
.sfoot{flex:none;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--bg);border-top:2px solid var(--line)}
.sfoot .in2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;max-width:608px;margin:0 auto}
.sfoot .btn{min-height:56px;padding:0 8px;font-size:1rem}
.srch{position:relative;min-width:0}
.srch>svg{position:absolute;left:12px;top:50%;width:20px;height:20px;margin-top:-10px;fill:none;stroke:var(--mute);stroke-width:2.4;stroke-linecap:round;pointer-events:none}
.srch input{height:46px;min-height:0;padding:0 12px 0 38px;border-radius:16px;font-size:1rem;-webkit-appearance:none;appearance:none}
.srch.has input{padding-right:40px}
.srch input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.qx{position:absolute;right:3px;top:50%;margin-top:-20px;display:grid;place-items:center;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--mute);cursor:pointer}
.qx svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round}
.ghost:active{transform:scale(.96)}
@media (prefers-reduced-motion:no-preference){
.ghost{transition:transform .45s cubic-bezier(.2,1.6,.35,1),background-color .25s,color .25s}
.ghost:active{transition:transform .12s ease-out}}
@media (prefers-reduced-motion:no-preference){
.stu{transition:transform .45s cubic-bezier(.2,1.6,.35,1),background-color .32s ease,border-color .32s ease,color .32s ease}
.stu:active{transition:transform .12s ease-out}
.st{transition:background-color .32s ease,color .32s ease}
.btn{transition:transform .45s cubic-bezier(.2,1.6,.35,1),background-color .25s,color .25s}
.btn:active{transition:transform .12s ease-out}
.mnu{transition:transform .28s cubic-bezier(.2,1.4,.4,1),opacity .18s ease,visibility 0s .28s}
.mnu.open{transition:transform .28s cubic-bezier(.2,1.4,.4,1),opacity .18s ease,visibility 0s}
.scr{transition:transform .4s cubic-bezier(.22,.9,.3,1)}
.chv{transition:transform .32s cubic-bezier(.2,1.4,.4,1)}
.mbd{transition:grid-template-rows .34s ease,opacity .28s ease,visibility 0s .34s}
.mr.open .mbd{transition:grid-template-rows .34s ease,opacity .28s ease .04s,visibility 0s}
.wa.go{animation:okp .5s ease}}
@keyframes okp{40%{transform:scale(.96)}70%{transform:scale(1.03)}}
@media (prefers-reduced-motion:no-preference){
.dc{animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
.chk circle{stroke-dasharray:151;stroke-dashoffset:151;animation:dr .5s .1s forwards}
.chk path{stroke-dasharray:40;stroke-dashoffset:40;animation:dr .35s .5s forwards}
.jb,.jb::before{transition:opacity .2s}
.jb button{transition:transform .26s cubic-bezier(.2,1.6,.35,1),font-weight .26s ease,color .18s ease,opacity .18s}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@keyframes dr{to{stroke-dashoffset:0}}
.nm{flex-wrap:nowrap;align-items:flex-start;gap:0 5px;font-size:1rem}
.nm>span:last-child{min-width:0}
.rn{flex:none;min-width:1.3em;margin-top:.1em;font-size:.82rem;font-weight:800;line-height:1.3;text-align:right;color:var(--tot);font-variant-numeric:tabular-nums}
.stu[data-lv] .rn{color:inherit;opacity:.8}
.stu{padding:4px 7px 5px 8px}
.st{width:22px;height:22px}
.jb.w3 button{font-size:9px}
.top{padding:8px 0 10px}
.hd{margin-bottom:6px}
.top h1{font-size:1.2rem}
.mbtn{width:44px;height:44px}
.top input,.dchip{min-height:40px}
.tabs{margin:8px 0 6px}
.tab{min-height:36px}
.tools{margin-bottom:6px}
.ghost{min-height:40px}
.srch input{height:40px}
.hint{margin-bottom:6px}
/* shiny student cards */
:root{--pc:#DDF7EE;--pbd:#86D8BA;--gh:.7;--gm:.14;--gs:.35;--chip:rgba(255,255,255,.78);--ring:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pc:#123A33;--pbd:#2F9479;--gh:.16;--gm:.04;--gs:.1;--chip:rgba(255,255,255,.1);--ring:rgba(255,255,255,.18)}}
:root[data-theme="dark"]{--pc:#123A33;--pbd:#2F9479;--gh:.16;--gm:.04;--gs:.1;--chip:rgba(255,255,255,.1);--ring:rgba(255,255,255,.18)}
